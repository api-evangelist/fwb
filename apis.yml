aid: fwb
name: Fwb
description: Friends With Benefits (FWB) is a Web3 cultural community and member-owned
  organization that blends online culture, IRL events, and token-gated membership. It
  operates the $FWB token, publishes an editorial arm, runs member governance, and
  produces gatherings such as FWB FEST (its annual festival in Idyllwild, CA) alongside
  builder programs like World Build Labs. Surfaced as a portfolio company of Kindred
  Ventures and added to the API Evangelist network. At the time of enrichment FWB
  publishes no public API, developer portal, SDK, or machine-readable developer
  surface — this profile captures its public identity and member-facing web
  properties.
